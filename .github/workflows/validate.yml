name: Validate Wortin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check learning-media.js
          node --check theme-init.js
          node --check pwa-register.js
          node --check sw.js
          node --check scripts/build-site.cjs
          node --check tests/browser-smoke.cjs
      - name: Validate source and security boundaries
        run: node scripts/validate-site.cjs
      - name: Run automated tests
        run: node --test tests/*.test.cjs
      - name: Build deployment artifact
        run: node scripts/build-site.cjs
      - name: Verify deployment artifact excludes private project files
        run: |
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test ! -d _site/supabase
          test ! -d _site/scripts
          test ! -d _site/tests
          test ! -f _site/README.md
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Serve built application
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/wortin-http.log 2>&1 &
          echo $! >/tmp/wortin-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wortin-http.log
          exit 1
      - name: Run desktop and mobile browser tests
        run: node tests/browser-smoke.cjs
      - name: Calculate exact pinned Supabase SDK integrity digest
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js'
          curl --fail --silent --show-error --location --retry 3 "$url" -o /tmp/wortin-supabase-sdk.js
          test -s /tmp/wortin-supabase-sdk.js
          digest="sha384-$(openssl dgst -sha384 -binary /tmp/wortin-supabase-sdk.js | openssl base64 -A)"
          expected="$(node -e 'const fs=require("node:fs"); const html=fs.readFileSync("index.html","utf8"); const tag=html.match(/<script[^>]*supabase-js@2\\.117\\.3[^>]*>/i)?.[0]||""; const sri=tag.match(/integrity="(sha384-[A-Za-z0-9+/=]+)"/)?.[1]; if(!sri) process.exit(1); process.stdout.write(sri);')"
          test "$digest" = "$expected"
          echo "Supabase SDK SRI verified against the exact CDN bytes: $digest"

