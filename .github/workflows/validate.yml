name: Validate Wortin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check learning-media.js
          node --check theme-init.js
          node --check pwa-register.js
          node --check sw.js
          node --check scripts/build-site.cjs
          node --check tests/browser-smoke.cjs
      - name: Validate source and security boundaries
        run: node scripts/validate-site.cjs
      - name: Run automated tests
        run: node --test tests/*.test.cjs
      - name: Build deployment artifact
        run: node scripts/build-site.cjs
      - name: Verify deployment artifact excludes private project files
        run: |
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test ! -d _site/supabase
          test ! -d _site/scripts
          test ! -d _site/tests
          test ! -f _site/README.md
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Serve built application
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/wortin-http.log 2>&1 &
          echo $! >/tmp/wortin-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wortin-http.log
          exit 1
      - name: Run desktop and mobile browser tests
        run: node tests/browser-smoke.cjs
      - name: Run Lighthouse on the built desktop and mobile site
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          target_url='http://127.0.0.1:4173/'
          npx --yes lighthouse@13.5.0 "$target_url" \
            --chrome-path="$chrome_path" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=/tmp/wortin-lighthouse-mobile.json --quiet
          npx --yes lighthouse@13.5.0 "$target_url" \
            --chrome-path="$chrome_path" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=/tmp/wortin-lighthouse-desktop.json --quiet
          node <<'NODE'
          const fs = require('node:fs');
          for (const mode of ['mobile', 'desktop']) {
            const report = JSON.parse(fs.readFileSync('/tmp/wortin-lighthouse-' + mode + '.json', 'utf8'));
            console.log('\n=== Lighthouse ' + mode.toUpperCase() + ' ===');
            for (const [key, category] of Object.entries(report.categories || {})) {
              console.log(key + ': ' + (category.score == null ? 'N/A' : Math.round(category.score * 100) + '/100'));
            }
            for (const key of ['first-contentful-paint', 'largest-contentful-paint', 'speed-index', 'total-blocking-time', 'cumulative-layout-shift']) {
              const audit = report.audits?.[key];
              if (audit && audit.numericValue != null) console.log(key + ': ' + Math.round(audit.numericValue));
            }
          }
          NODE
      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wortin-lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/wortin-lighthouse-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Calculate exact pinned Supabase SDK integrity digest
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js'
          curl --fail --silent --show-error --location --retry 3 "$url" -o /tmp/wortin-supabase-sdk.js
          test -s /tmp/wortin-supabase-sdk.js
          digest="sha384-$(openssl dgst -sha384 -binary /tmp/wortin-supabase-sdk.js | openssl base64 -A)"
          expected="$(node -e 'const fs=require("node:fs"); const html=fs.readFileSync("index.html","utf8"); const start=html.indexOf("<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js\""); const end=start<0?-1:html.indexOf(">",start); const tag=end<0?"":html.slice(start,end+1); const sri=tag.match(/integrity="(sha384-[A-Za-z0-9+/=]+)"/)?.[1]; if(!sri) process.exit(1); process.stdout.write(sri);')"
          test "$digest" = "$expected"
          echo "Supabase SDK SRI verified against the exact CDN bytes: $digest"

