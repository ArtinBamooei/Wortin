name: Deploy Wortin to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        shell: bash
        run: |
          awk '/<script>/{inside=1;next} index($0, "</script>"){inside=0} inside{print}' index.html > /tmp/wortin-app.js
          node --check /tmp/wortin-app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const id of ['view-home', 'view-learn', 'view-dictionary', 'view-review', 'view-stats', 'wordList', 'studyContent', 'dbStatus']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing required app node: ' + id);
          }
          if (html.includes('!p.known && (!p.due')) throw new Error('Stale review-scheduling logic detected');
          for (const token of ['function dayWordCount', 'recordActivity(word.id)', 'labels[(d.getDay()+1)%7]']) {
            if (!html.includes(token)) throw new Error('Missing expected learning logic: ' + token);
          }
          for (const token of [
            '[0,1000,2000,3000].map(fetchWordPage)',
            'const stored=JSON.parse(localStorage.getItem(CACHE_KEY)||"[]")',
            '.word-meaning{grid-column:1;grid-row:2',
            '.field input,.command-input input,.select{font-size:16px}',
            'card.classList.toggle("flipped",study.revealed)',
            'if(activeView==="stats")renderTypeStats()',
            '.word-main:focus-visible',
            'role="button" tabindex="0" aria-label="شروع',
            'themeColor.content=t==="dark"?"#171a16":"#f6f7f1"'
          ]) {
            if (!html.includes(token)) throw new Error('Missing mobile/performance regression safeguard: ' + token);
          }
          console.log('Wortin HTML and mobile performance smoke checks passed');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
