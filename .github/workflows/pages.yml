name: Deploy Wortin to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'supabase/migrations/**'
      - '.github/dependabot.yml'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate app JavaScript and security
        shell: bash
        run: |
          node --check app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8') + fs.readFileSync('app.js', 'utf8') + fs.readFileSync('styles.css', 'utf8');
          const app = fs.readFileSync('app.js', 'utf8');
          const policy = fs.readFileSync('index.html', 'utf8');
          if (!policy.includes('http-equiv="Content-Security-Policy"')) throw new Error('Missing CSP meta policy');
          if (!policy.includes("script-src 'self' https://cdn.jsdelivr.net")) throw new Error('CSP script policy must not allow arbitrary inline scripts');
          if (/\\b(?:eval|Function)\\s*\\(/.test(app)) throw new Error('Dynamic code execution sink detected');
          if (/service_role|sb_secret_[A-Za-z0-9_]+/.test(policy + app)) throw new Error('Potential Supabase secret key exposed in public code');
          console.log('Wortin security smoke checks passed');
          for (const id of ['view-home', 'view-learn', 'view-daily', 'view-dictionary', 'view-review', 'view-stats', 'wordList', 'studyContent', 'dailyContent', 'dailyCounter', 'dailyProgress', 'typeFilter', 'typeStats', 'dbStatus']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing required app node: ' + id);
          }
          if (html.includes('!p.known && (!p.due')) throw new Error('Stale review-scheduling logic detected');
          for (const token of ['function dayWordCount', 'recordActivity(word.id)', 'labels[(d.getDay()+1)%7]']) {
            if (!html.includes(token)) throw new Error('Missing expected learning logic: ' + token);
          }
          for (const token of [
            '[0,1000,2000,3000].map(fetchWordPage)',
            'const stored=JSON.parse(localStorage.getItem(CACHE_KEY)||"[]")',
            '.word-meaning{grid-column:1;grid-row:2',
            '.field input,.command-input input,.select{font-size:16px}',
            'card.classList.toggle("flipped",study.revealed)',
            'if(activeView==="stats")renderTypeStats()',
            '.word-main:focus-visible',
            'role="button" tabindex="0" aria-label="شروع',
            '@media(max-width:620px) and (max-height:700px)',
            'themeColor.content=t==="dark"?"#171a16":"#f6f7f1"',
            'Wortin restrained modern 3D color pass',
            '--accent-mint:#b3e5d5',
            '@keyframes wortinAuraFloat',
            'perspective(850px) translateY(-3px) rotateX(1.5deg) rotateY(-1.4deg)',
            'filter:none;',
            '#view-learn .flash-back{transform:rotateY(180deg) translateZ(1px)}',
            '#view-home .hero-art::before,#view-home .hero-art::after,#view-home .core{animation:none!important}'
          ]) {
            if (!html.includes(token)) throw new Error('Missing mobile/performance regression safeguard: ' + token);
          }
          for (const token of ['DAILY_KEY', 'function beginDailyReview()', 'function renderDailyReview()', 'Math.round(eligible.length*.6)', 'data-view="daily"', 'daily.studied.push(id)']) {
            if (!html.includes(token)) throw new Error('Missing daily-learning regression safeguard: ' + token);
          }
          for (const token of ['function typeCounts(){const a={};', 'Verbpartikel:"جزء فعلی جداشدنی"', 'split(" / ").includes(type)']) {
            if (!html.includes(token)) throw new Error('Missing vocabulary taxonomy regression safeguard: ' + token);
          }
          console.log('Wortin HTML, daily-learning, taxonomy, mobile and performance smoke checks passed');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@f7615f5917213b24245d49ba96693d0f5375a414 # immutable commit
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
